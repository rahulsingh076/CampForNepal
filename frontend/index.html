<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values; without it the safe-area padding on the mobile action bars and
         floating contact button silently computes to zero on notched phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/jpeg" href="/brand/camp-for-nepal-icon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Camp For Nepal</title>
    <meta name="description" content="Small-group journeys, treks, and expeditions across Nepal with experienced local guides." />
    <meta property="og:site_name" content="Camp For Nepal" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Camp For Nepal" />
    <meta property="og:description" content="Small-group journeys, treks, and expeditions across Nepal with experienced local guides." />
    <!-- Social scrapers do not run JavaScript, so this static fallback is the
         preview every shared link gets. usePageMeta swaps in a record's own
         image at runtime for crawlers that do render. -->
    <meta property="og:image" content="/brand/camp-for-nepal-logo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Camp For Nepal" />
    <meta name="twitter:description" content="Small-group journeys, treks, and expeditions across Nepal with experienced local guides." />
    <meta name="twitter:image" content="/brand/camp-for-nepal-logo.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
